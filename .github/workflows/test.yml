name: Test

on:
  workflow_call:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test
        run: ./gradlew cleanTest test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: success() || failure()
        with:
          report_paths: build/test-results/test/TEST-*.xml

      - name: Copy HTML Test Report
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p static
          cp -r build/reports/jacoco/test/html static/coverage
          cp -r build/reports/tests/test static/tests

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main'
        with:
          name: test-results-${{ github.head_ref || github.ref_name }}
          retention-days: 1
          path: static